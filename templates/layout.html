<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="YT Music">
    <title>YouTube Music</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="navbar">
        <div class="nav-left">
            <a href="/" class="brand">
                <span class="brand-icon">▶</span>Music
            </a>
        </div>
        <div class="nav-center">
            <form action="/search" method="GET" class="search-form">
                <input type="text" name="q" placeholder="Search" required>
                <button type="submit">🔍</button>
            </form>
        </div>
        <div class="nav-right" style="display: table-cell; vertical-align: middle; text-align: right; width: 100px;">
            <a href="/library" style="color: #fff; text-decoration: none; font-size: 14px; padding-right: 8px;">Library</a>
            <a href="/settings" style="color: #fff; text-decoration: none; font-size: 14px; padding-right: 8px;">⚙</a>
        </div>
    </header>
    <main class="content" id="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Global Persistent Player -->
    <div id="bottom-player" style="display: none;">
        <div class="player-progress">
            <div id="progress-bar"></div>
        </div>
        <div class="player-inner">
            <img id="player-thumb" src="" alt="Cover">
            <div class="player-info">
                <div id="player-title">Song Title</div>
                <div id="player-time">0:00</div>
            </div>
            <div class="player-controls">
                <button id="btn-play-pause">▶</button>
            </div>
        </div>
    </div>
    
    <audio id="global-audio"></audio>
    <script src="{{ url_for('static', filename='player.js') }}"></script>
</body>
</html>
