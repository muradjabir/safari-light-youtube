{% extends 'layout.html' if not request.headers.get('X-Requested-With') == 'XMLHttpRequest' else 'base_ajax.html' %}
{% block content %}
<div class="player-container">
    <div class="album-art-container">
        {% if thumbnail %}
        <img src="{{ proxy_image(thumbnail) }}" alt="Album Art" class="album-art">
        {% endif %}
    </div>
    
    <div class="now-playing-title">{{ song_title }}</div>
    <div class="now-playing-artist">{{ artist }}</div>
    
    <div class="audio-container">
        <!-- Native audio player -->
        <audio controls autoplay id="audio-player">
            <source src="/stream/{{ video_id }}">
            Your browser does not support the audio element.
        </audio>
    </div>
</div>
{% endblock %}
