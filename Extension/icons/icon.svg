<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Mask to punch a hole through the shape -->
    <mask id="cutout">
      <!-- Everything white is kept opaque -->
      <rect width="128" height="128" fill="white" />
      <!-- Everything black becomes transparent -->
      <polygon points="54,48 54,80 82,64" fill="black" />
    </mask>
  </defs>

  <!-- Outer Ring -->
  <circle cx="64" cy="64" r="54" fill="none" stroke="#000000" stroke-width="8" />
  
  <!-- Inner Core with the play button cut out -->
  <circle cx="64" cy="64" r="36" fill="#000000" mask="url(#cutout)" />
</svg>
